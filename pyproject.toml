[project]
name = "life-data-lake"
version = "0.1.0"
description = "Local-first Life Data Lake with Telegram ingestion"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Your Name", email = "you@example.com" }
]
keywords = ["telegram", "life-os", "data-lake", "local-first", "pvp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Home Automation",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.14",
    "pre-commit>=4.0",
]
prod = [
    "telethon>=1.35",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-dotenv>=1.0",
    "aiohttp>=3.11",
    "aiosqlite>=0.20",
    "httpx>=0.28",
    "trafilatura>=1.12",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "typer>=0.15",
    "rich>=13.9",
    "structlog>=24.4",
    "tenacity>=9.0",
    "playwright>=1.50",
    "google-generativeai>=0.8",
]

[project.scripts]
life-lake = "app.main:cli"

[dependency-groups]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.14",
]

[tool.ruff]
target-version = "py312"
line-length = 100
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "RUF", # Ruff-specific rules
]
ignore = [
    "E501",  # line too long handled by formatter
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "UP007", # use kwarg-only for future typing
]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
enable_recursive_aliass = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"